[package]
name = "identity"
version = "0.1.0"
autotests = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local device identity, keys, and TLS transport certificates."

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
eros.workspace = true
rand = "0.10"
rcgen = { version = "0.14.10", features = ["zeroize"] }
serde.workspace = true
sha2 = "0.11.1"
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json = "1"
x509-parser = { version = "0.18.1", features = ["verify"] }
