[workspace]
members = [
    "src-tauri",
    "crates/native-webview-surface",
    "crates/framed-ipc",
    "crates/semantic-input",
]
resolver = "2"

[workspace.dependencies]
eros = "0.8"
framed-ipc = { path = "crates/framed-ipc" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
