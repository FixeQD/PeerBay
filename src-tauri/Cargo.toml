[package]
name = "peerbay"
version = "0.1.0"
autotests = true
description = "Local-first peer-to-peer connectivity and sharing across Android, Linux, and Windows"
authors = ["FixeQ"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "peerbay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

# Linux capability adapters.
linux-x11 = []
linux-wayland = []
linux-pipewire = []
linux-bluez = []
linux-direct-network = []
linux-all = [
    "linux-x11",
    "linux-wayland",
    "linux-pipewire",
    "linux-bluez",
    "linux-direct-network",
]

# Windows capability adapters.
windows-win32 = []
windows-winrt = []
windows-wifi-direct = []

# Android native bridges and optional feature backends.
android-jni = []
android-services = []
media = []
adb = []
scrcpy = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eros.workspace = true
framed-ipc.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid.workspace = true
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
zeroize = "1"
rcgen = { version = "0.14.10", features = ["zeroize"] }
sha2 = "0.11.1"
path-clean = "1.0.1"

[dev-dependencies]
x509-parser = { version = "0.18.1", features = ["verify"] }
tempfile = "3"
