[package]
name = "peerbay"
version = "0.1.0"
description = "Local-first peer-to-peer connectivity and sharing across Android, Linux, and Windows"
authors = ["FixeQ"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "peerbay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
